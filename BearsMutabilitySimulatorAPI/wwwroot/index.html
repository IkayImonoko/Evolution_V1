<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bears Mutability Simulator</title>
</head>

<body onload="updateView()">
<div id="app">
    <canvas id="myCanvas" width="800" height="800" style="border:1px solid black;"></canvas>
</div>
<script>
    // while (true){
    //     const intervalId = setInterval(updateView(), 100);
    // }
    updateView();
    async function updateView(){
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');
        const points = await getBearsFromApi();
        points.forEach(point => {
            ctx.beginPath();
            ctx.arc(point.position[0], point.position[1], 3, 0, Math.PI * 2);
            ctx.fillStyle = `rgb(${point.color})`;
            ctx.fill();
            ctx.closePath();
        });
        
    }
    
    async function getBearsFromApi() {
        const url = "/bears";
        const response = await fetch(url);
        return await response.json();
    }
    
</script>

</body>

</html>
